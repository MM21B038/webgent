# Defaults baked into the Docker image. Runtime overrides (no rebuild):
#   1) .env / WEBGENT_* environment variables (highest priority)
#   2) bind-mounted settings.toml or WEBGENT_SETTINGS_PATH
# Model names: WEBGENT_LLM_MODEL, WEBGENT_VLM_MODEL, WEBGENT_EMB_MODEL

[browser]
# Run Chromium without a visible window (useful on servers or SSH).
headless = false

# X11 display for headed mode. Leave empty to use the process DISPLAY env.
# webgent sets this before launching Chromium when non-empty.
display = ":0.0"

[proxy]
# Burp-style intercepting proxy for exact request/response body capture.
enabled = true
# embedded = start mitmproxy in-process; external = use external_server only.
mode = "embedded"
host = "127.0.0.1"
port = 8888
# When mode = external, e.g. "http://127.0.0.1:8080" (Burp default).
external_server = ""
max_body_bytes = 1048576
# false = route localhost through the proxy (recommended for full capture).
bypass_loopback = false

[server]
# HTTP Streamable MCP (not stdio). Endpoint: http://{host}:{port}/mcp
# In Docker the image binds 0.0.0.0 via WEBGENT_SERVER_HOST; keep 127.0.0.1 for local uv.
transport = "http"
host = "127.0.0.1"
port = 3333

[snapshot]
# Collapse long option lists and repetitive rows when count exceeds list_threshold.
list_threshold = 30
list_head = 10
list_tail = 10
iframe_retry_count = 2
iframe_retry_delay_s = 0.5

[mcp.cursor]
# MCP URL defaults to http://{server.host}:{server.port}/mcp when url is omitted.
server_info_resource = "webgent://server-info"
prompt = "agent_system_prompt"

[agent]
llm_model = "openrouter/free"
vlm_model = "openrouter/free"
emb_model = "nvidia/llama-nemotron-embed-vl-1b-v2:free"
