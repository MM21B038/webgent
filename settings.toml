[browser]
# Run Chromium without a visible window (useful on servers or SSH).
headless = false

# X11 display for headed mode. Leave empty to use the process DISPLAY env.
# webgent sets this before launching Chromium when non-empty.
display = ":0.0"

[proxy]
# Burp-style intercepting proxy for exact request/response body capture.
enabled = true
# embedded = start mitmproxy in-process; external = use external_server only.
mode = "embedded"
host = "127.0.0.1"
port = 8888
# When mode = external, e.g. "http://127.0.0.1:8080" (Burp default).
external_server = ""
max_body_bytes = 1048576
# false = route localhost through the proxy (recommended for full capture).
bypass_loopback = false

[server]
transport = "http"
host = "127.0.0.1"
port = 3333

[mcp.cursor]
# Suggested Cursor MCP server entry — copy into Cursor MCP settings.
url = "http://127.0.0.1:1234/mcp"
server_info_resource = "webgent://server-info"
prompt = "agent_system_prompt"

[agent]
llm_model = "DeepSeek"
vlm_model = "VisionChat"
emb_model = "Qwen3-Embedding-8B"