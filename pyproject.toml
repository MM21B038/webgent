[project]
name = "webgent"
version = "0.1.0"
description = "Playwright-based MCP server for browser automation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "playwright>=1.60.0",
    "fastmcp>=3.4.0",
    "mitmproxy>=12.2.3",
    "cryptography>=42.0.0",
    "ddddocr>=1.5.6",
    "composer-agent>=0.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
webgent = "webgent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
